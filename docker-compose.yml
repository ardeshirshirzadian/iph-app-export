version: '3.8'

services:
  superapp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: iph-superapp-frontend
    ports:
      - "3002:3000"
    volumes:
      - /home/ubuntu/iph-superapp-uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped

