# Tracked copy of the live Nginx site config for bookingapn.rasayesh.com —
# source of truth for review/history, NOT auto-deployed. Newly added to
# the repo alongside the gzip/http2 rollout (previously only
# iph-superapp.conf was tracked); see scripts/setup-redis-cache.sh for the
# same "documented but manually applied" pattern used for the Redis infra.
#
# Live path: /etc/nginx/sites-available/bookingapn.rasayesh.com
# (symlinked from /etc/nginx/sites-enabled/bookingapn.rasayesh.com;
# Certbot-managed SSL block — do not remove the "# managed by Certbot"
# comments, renewal tooling looks for them). To apply a change here to the
# live server:
#   1. sudo cp infra/nginx/sites-available/bookingapn.rasayesh.com.conf \
#        /etc/nginx/sites-available/bookingapn.rasayesh.com
#   2. sudo nginx -t   — MUST pass before reloading. This Nginx instance
#      also serves app.iphexpo.com, appapn.iphexpo.com, and
#      chatbot.iphexpo.com — validate before every reload.
#   3. sudo systemctl reload nginx

server {
    server_name bookingapn.rasayesh.com;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/booking.rasayesh.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/booking.rasayesh.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = bookingapn.rasayesh.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name bookingapn.rasayesh.com;
    return 404; # managed by Certbot


}
