# Tracked copy of the live Nginx site config for app.iphexpo.com — source
# of truth for review/history, NOT auto-deployed. See scripts/setup-redis-
# cache.sh for the same "documented but manually applied" pattern used for
# the Redis infra.
#
# Live path: /etc/nginx/sites-available/iph-superapp (symlinked from
# /etc/nginx/sites-enabled/iph-superapp). To apply a change here to the
# live server:
#   1. sudo cp infra/nginx/sites-available/iph-superapp.conf \
#        /etc/nginx/sites-available/iph-superapp
#   2. sudo nginx -t   — MUST pass before reloading. This Nginx instance
#      also serves appapn.iphexpo.com, chatbot.iphexpo.com, and two
#      rasayesh.com booking domains — validate before every reload.
#   3. sudo systemctl reload nginx
#
# `upstream iph_app_backend` load-balances round-robin across the 3
# iph-app replicas (3002, 3010, 3011) added for horizontal scaling.
# `keepalive 32` + `keepalive_timeout 4s` enable HTTP keepalive between
# Nginx and the backends (`keepalive_timeout` is deliberately set BELOW
# Node's default 5s `keepAliveTimeout` in server.js — otherwise Nginx can
# try to reuse a connection Node already closed server-side, surfacing as
# intermittent "upstream prematurely closed connection" errors under load;
# confirmed by reproducing and fixing this exact failure during the load
# test that validated this config).
#
# `$connection_upgrade` comes from conf.d/websocket-upgrade-map.conf —
# required so this same location block can support both WebSocket upgrade
# (Socket.IO) and HTTP keepalive at once; do not hardcode
# `Connection 'upgrade'` or `Connection ""` here directly.

upstream iph_app_backend {
    server 127.0.0.1:3002;
    server 127.0.0.1:3010;
    server 127.0.0.1:3011;
    keepalive 32;
    keepalive_timeout 4s;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name app.iphexpo.com;

    ssl_certificate /etc/letsencrypt/live/app.iphexpo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.iphexpo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /apn {
        return 404;
    }

    location / {
        proxy_pass http://iph_app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host app.iphexpo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host app.iphexpo.com;
        proxy_cache_bypass $http_upgrade;
    }
}
