# Tracked copy of the live Nginx site config for appapn.rasayesh.com —
# source of truth for review/history, NOT auto-deployed. Newly added to
# the repo alongside the gzip/http2 rollout (previously only
# iph-superapp.conf was tracked); see scripts/setup-redis-cache.sh for the
# same "documented but manually applied" pattern used for the Redis infra.
#
# Domain migrated 2026-08-20: appapn.iphexpo.com -> appapn.rasayesh.com.
# This copy reflects the pre-certbot staging state (see comment in the
# first server block below) — after certbot runs on the live server, sync
# this file from /etc/nginx/sites-available/appapn again to pick up the
# ssl_certificate lines certbot adds.
#
# Live path: /etc/nginx/sites-available/appapn (symlinked from
# /etc/nginx/sites-enabled/appapn). To apply a change here to the live
# server:
#   1. sudo cp infra/nginx/sites-available/appapn.conf \
#        /etc/nginx/sites-available/appapn
#   2. sudo nginx -t   — MUST pass before reloading. This Nginx instance
#      also serves app.iphexpo.com, chatbot.iphexpo.com, and two
#      rasayesh.com booking domains — validate before every reload.
#   3. sudo systemctl reload nginx

# ---- appapn.rasayesh.com (new) ----
# Pre-cert-issuance layout: HTTP only, no ssl_certificate lines yet (nginx
# -t would fail if it pointed at a cert that doesn't exist). Run:
#   sudo certbot --nginx -d appapn.rasayesh.com
# certbot's nginx plugin will find this block via server_name+listen 80,
# obtain the cert, and rewrite this file to add "listen 443 ssl" +
# ssl_certificate/ssl_certificate_key lines and an http->https redirect
# automatically.
server {
    listen 80;
    server_name appapn.rasayesh.com;

    client_max_body_size 55m;
    client_body_timeout 300s;

    location /uploads/ {
        alias /home/ubuntu/iph-superapp-uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- appapn.iphexpo.com (decommissioned) ----
# Old domain fully disabled. Kept as an explicit reject (rather than
# deleted outright) so requests don't silently fall through to another
# vhost via default Host/SNI matching. Reuses the still-valid existing
# cert purely to terminate TLS for the 404 response. Safe to delete this
# whole block once the appapn.iphexpo.com cert expires / nobody hits the
# old domain anymore.
server {
    listen 80;
    listen 443 ssl http2;
    server_name appapn.iphexpo.com;
    ssl_certificate /etc/letsencrypt/live/appapn.iphexpo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appapn.iphexpo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 404;
}
