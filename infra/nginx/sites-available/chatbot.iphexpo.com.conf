# Tracked copy of the live Nginx site config for chatbot.iphexpo.com —
# source of truth for review/history, NOT auto-deployed. Newly added to
# the repo alongside the gzip/http2 rollout (previously only
# iph-superapp.conf was tracked); see scripts/setup-redis-cache.sh for the
# same "documented but manually applied" pattern used for the Redis infra.
#
# Live path: /etc/nginx/sites-available/chatbot.iphexpo.com (symlinked
# from /etc/nginx/sites-enabled/chatbot.iphexpo.com; Certbot-managed SSL
# block — do not remove the "# managed by Certbot" comments, renewal
# tooling looks for them). To apply a change here to the live server:
#   1. sudo cp infra/nginx/sites-available/chatbot.iphexpo.com.conf \
#        /etc/nginx/sites-available/chatbot.iphexpo.com
#   2. sudo nginx -t   — MUST pass before reloading. This Nginx instance
#      also serves app.iphexpo.com, appapn.iphexpo.com, and two
#      rasayesh.com booking domains — validate before every reload.
#   3. sudo systemctl reload nginx

server {
    server_name chatbot.iphexpo.com;

    location /api/chat {
        proxy_pass http://127.0.0.1:8000/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
location /api/logs {
    proxy_pass http://127.0.0.1:8000/logs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chatbot.iphexpo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chatbot.iphexpo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = chatbot.iphexpo.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name chatbot.iphexpo.com;
    return 404; # managed by Certbot


}
