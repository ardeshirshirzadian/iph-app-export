# Tracked copy of a live Nginx snippet — source of truth for review/
# history, NOT auto-deployed. See scripts/setup-redis-cache.sh for the
# same "documented but manually applied" pattern used for the Redis infra.
#
# Live path: /etc/nginx/conf.d/gzip.conf, included automatically by
# /etc/nginx/nginx.conf's `include conf.d/*.conf;` (http context) — same
# mechanism as websocket-upgrade-map.conf, so this applies to every site
# sharing this Nginx instance (app.iphexpo.com, appapn.iphexpo.com,
# chatbot.iphexpo.com, and the rasayesh.com booking domains) with no
# per-site changes needed. To apply a change here to the live server:
#   1. sudo cp infra/nginx/conf.d/gzip.conf /etc/nginx/conf.d/gzip.conf
#   2. sudo nginx -t   — MUST pass before reloading (shared http-context
#      file — validate before every reload, same as the other conf.d file).
#   3. sudo systemctl reload nginx
#
# `gzip on;` was already set in the main nginx.conf, but every other gzip
# directive was commented out — critically `gzip_proxied`, which DEFAULTS
# TO `off`. Since every site here is a reverse proxy (100% of responses
# come from a proxied upstream), that default silently disabled
# compression for everything regardless of `gzip on;`, matching Lighthouse's
# usesCompression: false finding exactly. `gzip_proxied any;` below is what
# actually fixes it — the rest is standard tuning.
#
# Level 6 is Nginx's own typical balanced default (not maxed to 9, which
# costs meaningfully more CPU for marginal extra savings beyond ~6).
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    image/svg+xml;
