# Tracked copy of a live Nginx snippet — source of truth for review/
# history, NOT auto-deployed. See scripts/setup-redis-cache.sh for the
# same "documented but manually applied" pattern used for the Redis infra.
#
# Live path: /etc/nginx/conf.d/websocket-upgrade-map.conf, included
# automatically by /etc/nginx/nginx.conf's `include conf.d/*.conf;`
# (http context). To apply a change here to the live server:
#   1. sudo cp infra/nginx/conf.d/websocket-upgrade-map.conf \
#        /etc/nginx/conf.d/websocket-upgrade-map.conf
#   2. sudo nginx -t   — MUST pass before reloading (shared http-context
#      file — validate before every reload, same as the site config).
#   3. sudo systemctl reload nginx
#
# Only sites-available/iph-superapp.conf references $connection_upgrade,
# so this map is inert for every other site sharing this Nginx instance
# despite living in the shared conf.d/ directory.
#
# Lets a single location block support both WebSocket upgrade (Socket.IO)
# and HTTP keepalive to upstream at the same time. Without this, hardcoding
# `proxy_set_header Connection 'upgrade';` for every request (as iph-superapp
# already does) would keep WebSocket working but prevent keepalive reuse;
# hardcoding `proxy_set_header Connection "";` instead (the naive keepalive
# fix) would enable keepalive but break WebSocket upgrade entirely. This map
# picks the right value per-request based on whether it's actually an
# upgrade request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}
